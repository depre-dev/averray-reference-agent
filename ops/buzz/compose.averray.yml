# Averray's overrides on top of the upstream Buzz deploy/compose bundle.
#
#   docker compose -f compose.yml \
#     -f /srv/averray-reference-agent/ops/buzz/compose.averray.yml up -d
#
# Two jobs: reach the relay through the existing Cloudflare Tunnel, and stop a
# Buzz problem from killing the money monitor.
#
# ── REACHABILITY ────────────────────────────────────────────────────────────
# This VPS publishes NO inbound ports. `monitor.averray.com` and
# `command.averray.com` are served by a `cloudflared` tunnel that dials internal
# service URLs (see ops/compose.cloudflare-access.yml), which is why they
# resolve to Cloudflare IPs while `api`/`app` point at the origin directly.
#
# That rules out the obvious setup. A proxied A record to the VPS would make
# Cloudflare dial 141.94.121.188:443, where nothing listens — and Cloudflare
# will not proxy to port 3000 anyway; its origin ports are 80/8080/8880/2052…
# and 443/2053/2083/8443.
#
# So `buzz.averray.com` is a tunnel published route to `http://relay:3000`,
# exactly as the monitor is. Cloudflare creates that DNS itself as a CNAME to
# cfargotunnel.com — no hand-made A record, and none should be left lying around.
#
# The tunnel joins BUZZ's network, not the other way round. The first cut had it
# backwards — the relay was attached to avg-internal so cloudflared could see it,
# and that broke the relay outright:
#
#   Failed to connect to Postgres: password authentication failed for user "buzz"
#
# The avg stack has its own `postgres` service. With the relay on both networks,
# `postgres` in DATABASE_URL resolved to avg-postgres-1 instead of buzz's own,
# where the `buzz` role does not exist. A container on buzz-net ALONE connected
# with the identical URL — which is what finally located it.
#
# Joining two stacks' namespaces makes every generic service name a coin flip.
# So Buzz keeps its namespace to itself, and cloudflared gains one network where
# the only name it needs is `relay` (see ops/compose.cloudflare-access.yml).
#
# NO host port at all. The upstream bundle binds 0.0.0.0:3000, which on a box
# whose entire exposure model is "no open ports" quietly undoes that model — and
# the tunnel never needed it, since it dials the container over the network.
#
# A first pass kept it on loopback for `curl 127.0.0.1:3000/_liveness`
# convenience. That collided on the first start: something already holds :3000
# on this host (hermes-workspace, which this same tunnel serves as
# command.averray.com), and the relay refused to start. Convenience was not
# worth a port collision, nor the contradiction with the paragraph above.
#
# ── BLAST RADIUS ────────────────────────────────────────────────────────────
# 22 GiB total with ~19 available, so these ceilings are not about scarcity.
# There is NO SWAP: a spike is not slowness, it is an immediate OOM kill with
# the kernel choosing the victim — and this box also runs the monitor watching a
# live USDC money path. ~2.3 GiB of ceilings keep a Buzz problem from taking out
# the process whose whole job is noticing when the money stops.
#
# A service actually hitting its limit is a signal to read, not a number to
# raise reflexively.
services:
  relay:
    # `!reset` removes the upstream list rather than appending to it —
    # compose ≥ 2.24.4, which this bundle already requires.
    ports: !reset null
    mem_limit: 1g
    restart: unless-stopped

  postgres:
    mem_limit: 512m
    restart: unless-stopped

  redis:
    mem_limit: 256m
    restart: unless-stopped

  minio:
    # Media storage — grows with use, so this is the ceiling most likely to need
    # revisiting. Revisit it with evidence.
    mem_limit: 512m
    restart: unless-stopped
