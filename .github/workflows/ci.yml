name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # publish the runtime image to GHCR on main

jobs:
  node:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install zsh syntax-check shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Push only happens for main; on PRs this just logs in is skipped.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # On PRs: build only (validates the Dockerfile, incl. the in-image
      # Vite SPA build). On main: build + push the sha + latest tags.
      - name: Build (and push on main) the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile.node
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Compose file
        run: docker compose --env-file ops/.env.example -f ops/compose.yml -f ops/compose.prod.yml config

      # The Bank lane overlay is conditional at deploy time (deploy-monitor.sh
      # adds it only when the platform network exists), so nothing else here
      # would ever parse it. `config` does not contact the daemon about an
      # external network, so this validates the merge on a runner that has no
      # such network — which is the point.
      - name: Validate Compose file (with the Bank lane overlay)
        run: >-
          docker compose --env-file ops/.env.example
          -f ops/compose.yml -f ops/compose.prod.yml -f ops/compose.bank-feed.yml config

  int2-supervised-dispatch:
    name: INT-2 real dispatcher integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # The scripted fixtures pin an older approved revision. A shallow
          # checkout makes the local-only Git remote unable to serve it.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install reference dependencies
        run: npm ci

      - name: Prepare the dispatcher workspace root
        # DISPATCH_WORKSPACE_ROOT is a FIXED path baked into every approved task
        # hash (packages/averray-mcp/src/workspace-path.ts), so it cannot be
        # relocated to the runner temp — it must exist and be writable by the
        # runner. Without this, workspace preparation fails and the dispatcher
        # refuses with `workspace_prep_failed` before any Harness run is created.
        run: |
          sudo mkdir -p /var/lib/harness-dispatcher/workspaces
          sudo chown -R "$(id -u):$(id -g)" /var/lib/harness-dispatcher
          test -w /var/lib/harness-dispatcher/workspaces

      - name: Run required INT-2 mechanism suite
        env:
          INT2_HARNESS_DEPLOY_KEY: ${{ secrets.INT2_HARNESS_DEPLOY_KEY }}
          INT2_SUITE_EVIDENCE_DIR: ${{ runner.temp }}/int2-suite-evidence
          INT2E_SUITE_EVIDENCE_DIR: ${{ runner.temp }}/int2e-dispatch-store-evidence
        run: scripts/ceremony/run-int2-automated-suite.sh

      - name: Prove the suite did not skip
        if: always()
        run: test "$(tr -d '[:space:]' < '${{ runner.temp }}/int2-suite-evidence/executed-count.txt')" = "14"

      - name: Prove the INT-2e store suite did not skip
        if: always()
        run: test "$(tr -d '[:space:]' < '${{ runner.temp }}/int2e-dispatch-store-evidence/executed-count.txt')" = "6"

      - name: Upload INT-2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2-supervised-dispatch-evidence
          path: ${{ runner.temp }}/int2-suite-evidence
          if-no-files-found: error

      - name: Upload INT-2e store evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int2e-dispatch-store-evidence
          path: ${{ runner.temp }}/int2e-dispatch-store-evidence
          if-no-files-found: error

  int4-mechanism-drills:
    name: INT-4 mechanism drill (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # INT-4c D0 was retired per #790. Its durable record remains in
        # docs/evidence/INT4C_D0_PARTIAL_2026-08-06.md.
        include:
          - id: int4b
            runner: scripts/ceremony/run-int4b-drills.mjs
            expected: 5
            needs_harness: false
          - id: int4c
            runner: scripts/ceremony/run-int4c-drills.mjs
            expected: 6
            needs_harness: false
          - id: int4d
            runner: scripts/ceremony/run-int4d-drills.mjs
            expected: 6
            needs_harness: true
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup uv
        if: matrix.needs_harness
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install reference dependencies
        run: npm ci

      - name: Build drill package imports
        # npm ci has no lifecycle build. The drill children import the
        # workspace packages and dispatcher through exports that point at dist/.
        run: npm run build

      - name: Run INT-4 mechanism drill
        if: ${{ !matrix.needs_harness }}
        env:
          INT4_DRILL_EVIDENCE_DIR: ${{ runner.temp }}/int4-${{ matrix.id }}-evidence
        run: node ${{ matrix.runner }}

      - name: Run INT-4 mechanism drill with pinned Harness
        if: matrix.needs_harness
        env:
          INT2_HARNESS_DEPLOY_KEY: ${{ secrets.INT2_HARNESS_DEPLOY_KEY }}
          INT4_DRILL_EVIDENCE_DIR: ${{ runner.temp }}/int4-${{ matrix.id }}-evidence
        run: node ${{ matrix.runner }}

      - name: Prove the drill suite did not skip
        if: always()
        run: test "$(tr -d '[:space:]' < '${{ runner.temp }}/int4-${{ matrix.id }}-evidence/executed-count.txt')" = "${{ matrix.expected }}"

      - name: Upload INT-4 drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: int4-${{ matrix.id }}-drill-evidence
          path: ${{ runner.temp }}/int4-${{ matrix.id }}-evidence
          if-no-files-found: error
