# Copied into /opt/data/config.yaml by the operator after `hermes setup`.
# Keep this file declarative; Hermes owns its runtime data under /opt/data.
model:
  provider: ollama-cloud
  base_url: https://ollama.com/v1
  api_key_env: OLLAMA_API_KEY
  default: glm-5.2:cloud

# Pin v0.18's post-turn background-review fork to our own provider. Left unset
# it defaults to "auto" and falls through the auxiliary chain to OpenRouter →
# Nous Portal (no credit) → repeated credit-error log spam. Same model as above.
auxiliary:
  background_review:
    provider: ollama-cloud
    model: glm-5.2:cloud

mcp_servers:
  averray:
    command: /app/scripts/run-mcp-server.sh
    args: ["/app/packages/averray-mcp/dist/index.js"]
  wallet:
    command: /app/scripts/run-mcp-server.sh
    args: ["/app/packages/wallet-mcp/dist/index.js"]
  receipt:
    command: /app/scripts/run-mcp-server.sh
    args: ["/app/packages/receipt-mcp/dist/index.js"]
  trace:
    command: /app/scripts/run-mcp-server.sh
    args: ["/app/packages/trace-mcp/dist/index.js"]
  policy:
    command: /app/scripts/run-mcp-server.sh
    args: ["/app/packages/policy-mcp/dist/index.js"]

paths:
  skills: /opt/data/skills
  memory: /opt/data/memory.db
  plugins: /opt/data/plugins

# The Session API our monitor speaks to (POST /api/sessions, /chat, /chat/stream,
# /fork) is served by the `api_server` PLATFORM, and a platform has to be opted
# in HERE before any env var can turn it on.
#
# v0.18 enabled it from container env alone, so this block was never needed and
# its absence was invisible. v0.19.1 does not: gateway/config.py resolves
# `env > config > default`, meaning API_SERVER_* are an OVERRIDE LAYER on top of
# a config opt-in that must already exist. With no `platforms:` key there is
# nothing to override, the platform never registers, and the gateway logs
# "No messaging platforms enabled" and binds nothing — while reporting healthy.
#
# Proven on a v0.19.1 smoke against a COPY of the prod home (2026-07-31): with
# API_SERVER_ENABLED/HOST/PORT/KEY all set and a model configured, nothing
# listened on 8642 until this block existed. Harmless on v0.18, which simply
# ignores it — so it is safe to land BEFORE the upgrade.
#
# Key, port and bind address stay in the environment (ops/compose.command-center.yml);
# only the opt-in lives here.
#
# ── model_name: WHY THIS IS A REAL MODEL AND NOT A LABEL ──────────────────
#
# The api_server is an OpenAI-compatible endpoint, so it advertises a model in
# GET /v1/models and clients send that id back on every request. Left unset it
# advertises the string `hermes-agent` — a VIRTUAL name that Hermes is supposed
# to recognise as its own and swap for the configured model before calling the
# provider (gateway/platforms/api_server.py passes it as `virtual_model=` and
# only treats a request as a route when `model != self._model_name`).
#
# On v0.20.0 that swap stopped happening. The virtual name reached the provider
# verbatim and Ollama Cloud answered, correctly, `model "hermes-agent" not
# found` — so every question asked in Buzz #Ops failed with a 404 for six
# hours on 2026-08-04 while the gateway, the Session API and the MCP surface
# were all healthy. Config was right; env was right; only the name on the wire
# was wrong.
#
# Naming a REAL model here fixes it in a way that does not depend on upstream:
# whether or not the virtual-model swap works, the string clients send is now
# one the provider will honour. The pass-through stops being a failure mode
# instead of merely being avoided. Keep it equal to `model.default` above —
# test/unit/hermes-config.test.ts fails if the two drift apart.
platforms:
  api_server:
    enabled: true
    model_name: glm-5.2:cloud

# ── THE TOOL SURFACE THIS DEPLOYMENT ACTUALLY NEEDS ───────────────────────
#
# Hermes ships a full personal-assistant toolset. This is a headless ops box
# that answers questions from five MCP servers and one skill, so most of that
# surface is unusable here — and one piece of it is a live escalation path.
#
# THE PATH: a message in the Buzz #Ops channel reaches a Hermes session with
# the whole tool surface (buzz-inbound.ts hands the question straight to one;
# its SELF/ECHO/RATE/mention guards are anti-loop, not authority). The gateway
# boots warning that api_server binds 0.0.0.0 with terminal.backend `local`,
# unsandboxed — "agent work dispatched through this endpoint runs as the host
# user with full terminal/file access". That host also runs the money-rail
# monitor, the Buzz relay, postgres and cloudflared.
#
# WHY NOT terminal.backend: docker, which is what the warning suggests. That
# backend shells out to `docker run`, so it needs a reachable daemon, and no
# docker socket is mounted into this container. Granting one would give Hermes
# root on the host — strictly worse than the local user it was meant to fix.
# Upstream agrees: /var/run/docker.sock is in its own tools' sensitive-path
# list. So the fix is not to sandbox the terminal. It is to not have one.
#
# SECOND, SMALLER BENEFIT: every enabled toolset's schemas ride in the context
# on every turn. Removing what cannot be used here makes each answer cheaper
# and the choice among remaining tools sharper.
#
# DELIBERATELY NOT DISABLED — each has a plausible use and deserves its own
# considered pass rather than being swept up here: file, code_execution,
# browser/browser-cdp (testbed missions), delegation, memory, skills, web,
# session_search, cronjob, project, todo, clarify.
agent:
  disabled_toolsets:
    # The escalation path. Our answers come from MCP tools, never a shell.
    - terminal
    # GUI control of a machine with no GUI.
    - computer_use
    # Not ops functions, and unusable on a headless server.
    - image_gen
    - video_gen
    - video
    - tts
    - vision
    # We keep our own orchestration control plane (O1-O5, dispatch-policy.ts,
    # autopilot). Adopting upstream Kanban would regress those guardrails —
    # decided in docs/HERMES_UPGRADE_v017.md and still true.
    - kanban
