# Optional Cloudflare Access/Tunnel overlay for the Hermes Workspace command
# center and private handoff monitor. This publishes selected internal HTTP
# services through Cloudflare Zero Trust without opening public inbound ports on
# the VPS.
#
# Cloudflare dashboard settings:
# - Tunnel public hostname: command.example.com
# - Tunnel service URL: http://hermes-workspace:3000
# - Optional monitor hostname: monitor.example.com
# - Optional monitor service URL: http://slack-operator:8790
# - Access apps: self-hosted, same hostnames, allow only explicit operator
#   emails.
services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["command-center"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      hermes-workspace:
        condition: service_started
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TUNNEL_TOKEN:?Set CLOUDFLARED_TUNNEL_TOKEN in .env.prod}"]
    # buzz-net carries the Buzz relay, published as buzz.averray.com. The tunnel
    # reaches INTO that stack rather than the relay reaching out into this one:
    # both stacks run a service called `postgres`, so a container on both
    # networks resolves that name unpredictably — which is exactly how the relay
    # ended up authenticating against avg-postgres-1 and failing.
    #
    # cloudflared needs only one name from Buzz (`relay`), and buzz-net holds
    # nothing that shadows a name cloudflared already uses, so the asymmetry is
    # safe in this direction and not in the other.
    networks: [avg-internal, buzz-net]

networks:
  # Created by the Buzz compose project. The project is `buzz-prod`, NOT `buzz` —
  # upstream's compose.yml declares `name: buzz-prod` on line 1, so every Docker
  # object is prefixed with that. The first stand-up used upstream's ./run.sh,
  # which passes `-p buzz` and overrides it, producing a `buzz`-prefixed stack
  # that a later plain `docker compose -f compose.yml -f <override>` did not
  # reuse — it built a SECOND, parallel stack instead. Hence: always invoke Buzz
  # with the plain form (see ops/buzz/compose.averray.yml), never run.sh.
  #
  # Optional-by-profile: this overlay only runs under the command-center profile,
  # and the network must already exist when it does.
  buzz-net:
    external: true
    name: buzz-prod_buzz-net
