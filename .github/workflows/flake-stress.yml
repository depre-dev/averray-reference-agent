name: Flake stress

# Concurrency-sensitive tests only fail under full-suite parallel load. Two
# screencast races reached main because a single suite run is a ~19% coin flip:
#
#   #561  manifest publication race     (torn manifest / late overwrite)
#   #562  atomic frame publish          (introduced an ENOENT race on latest.jpg)
#
# NOTE ON DESIGN: running the affected file alone, or with `--repeat`, does NOT
# reproduce these. Measured against the known-broken commit 0d6912a: the file
# alone failed 0/15 runs and `--repeat 40` passed, while the FULL suite failed
# ~3/16. A per-file stress job would therefore have been green against broken
# code — an un-fireable check. The whole suite must run, repeatedly.
#
# Verified the loop below detects the known flake: it fired on run 2 of 10
# against 0d6912a.

on:
  schedule:
    - cron: "17 3 * * *"      # nightly
  workflow_dispatch:
    inputs:
      iterations:
        description: "Full-suite iterations"
        required: false
        default: "10"
  pull_request:
    # PR-time coverage only for the areas whose races we have actually seen —
    # plus this workflow itself, so a change to the job is exercised by the PR
    # that makes it. Without that last path the job never ran on its own PRs,
    # which is why three setup gaps (missing zsh, shallow checkout, missing
    # build) each merged green and surfaced only on a later dispatched run.
    paths:
      - ".github/workflows/flake-stress.yml"
      - "services/slack-operator/src/testbed-live-screencast.ts"
      - "test/unit/testbed-live-screencast.test.ts"
      - "services/slack-operator/src/index.ts"

permissions:
  contents: read

jobs:
  stress:
    name: Full-suite stress
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Some suite tests resolve a fixture's baseRevision; a shallow clone
          # cannot, and fails with `git 128`.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install zsh syntax-check shell
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        # `tsc -b` produces the dist entries that @avg/* imports resolve to.
        # Without it vitest fails to COLLECT every suite file with
        # "Failed to resolve entry for package @avg/mcp-common" — which reads
        # as a mass test failure rather than a missing build. ci.yml's node job
        # gets this from its Typecheck step; this job runs the same suite and
        # needs the same prerequisite.
        run: npm run typecheck

      - name: Repeat the full suite
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '10' }}
        run: |
          set -u
          failures=0
          ran=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::full-suite run $i / $ITERATIONS"
            if npx vitest run > "run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              failures=$((failures + 1))
              echo "run $i: FAIL"
              # A resolution failure ("Failed to load url @avg/…", "Failed to
              # resolve entry for package") matched none of these patterns, so
              # an unbuilt checkout printed a bare "FAIL" with no cause. That is
              # how the missing-build bug #606 fixed stayed red and unread.
              grep -E "^ FAIL |Failed to (load url|resolve)|Error:|AssertionError" "run-$i.log" | head -20 || true
            fi
            ran=$((ran + 1))
            echo "::endgroup::"
          done

          echo "completed $ran run(s), $failures failure(s)"

          # A stress job that silently ran zero iterations is green by absence,
          # which reads as evidence. Fail closed instead.
          if [ "$ran" -eq 0 ]; then
            echo "::error::stress job executed no iterations"
            exit 1
          fi
          # EVERY run failing is not a race. A flake that fires 100% of the time
          # is a broken build, and asserting "flaky" regardless of the ratio
          # sent the reader hunting a concurrency bug that did not exist — for
          # days, while the suite itself was green. Name the two cases apart.
          if [ "$failures" -eq "$ran" ] && [ "$ran" -gt 1 ]; then
            echo "::error::ALL $ran full-suite runs failed — deterministic, not flake. Look for a build/resolution error in the logs before hunting a race."
            exit 1
          fi
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures of $ran full-suite runs failed — a concurrency-sensitive test is flaky"
            exit 1
          fi

      - name: Upload failing run logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flake-stress-logs
          path: run-*.log
          retention-days: 7
